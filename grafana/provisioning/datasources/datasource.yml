# Grafana 数据源自动配置
# 放在 provisioning/datasources/ 下的好处：容器起来就有数据源，不用手工点界面，
# 配置即代码（Configuration as Code），可以跟着 Git 一起版本管理。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-ds
    access: proxy                 # 走 Grafana 后端代理，浏览器不直连 Prometheus
    url: http://prometheus:9090   # docker 内部网络，用服务名访问
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
