# 告警规则
# 每条规则：expr 是判定表达式，for 表示持续多久才真正告警（避免瞬时抖动误报）
groups:
  - name: host-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率过高"
          description: "{{ $labels.instance }} CPU 使用率 {{ $value | printf \"%.1f\" }}%，持续 5 分钟超过 80%"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "{{ $labels.instance }} 内存使用率 {{ $value | printf \"%.1f\" }}%，超过 85%"

      - alert: DiskWillFillIn4Hours
        expr: |
          predict_linear(node_filesystem_free_bytes{fstype!~"tmpfs|overlay"}[1h], 4 * 3600) < 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "磁盘将在 4 小时内写满"
          description: "{{ $labels.instance }} 挂载点 {{ $labels.mountpoint }} 按当前速度 4 小时内将耗尽"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_size_bytes - node_filesystem_free_bytes)
          / node_filesystem_size_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "磁盘空间不足"
          description: "{{ $labels.mountpoint }} 已使用 {{ $value | printf \"%.1f\" }}%"

      - alert: NodeDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "监控目标失联"
          description: "{{ $labels.job }} / {{ $labels.instance }} 已掉线 1 分钟"

      - alert: HighLoadAverage
        expr: node_load5 > on(instance) count by(instance)(node_cpu_seconds_total{mode="idle"}) * 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "系统负载过高"
          description: "{{ $labels.instance }} 5 分钟负载 {{ $value }}，超过 CPU 核数的 2 倍"
